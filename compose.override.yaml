# Development overrides, applied automatically by `docker compose up`.
# For a production-style run use: docker compose -f compose.yaml up -d
services:
  api:
    build:
      args:
        INSTALL_DEV: "1"
    volumes:
      - ./backend:/app
    # --reload-dir keeps the reloader watching source only, never data or cache dirs.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
