# Optional: transcode on an NVIDIA GPU (NVENC). Needs the NVIDIA driver and the NVIDIA
# Container Toolkit on the host. See README, "Hardware transcoding".
#
#   COMPOSE_FILE=compose.yaml:compose.nvidia.yaml          (in .env / stack env)
#
# If the GPU can't be used, the API logs why and transcodes on the CPU as before.
services:
  crypttube-api:
    environment:
      HW_ACCEL: nvenc
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
