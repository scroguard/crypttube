# Optional: transcode on an NVIDIA GPU (NVENC). Needs the NVIDIA driver and the NVIDIA
# Container Toolkit on the host. See README, "Hardware transcoding".
#
#   COMPOSE_FILE=compose.yaml:compose.nvidia.yaml          (in .env / stack env)
#
# If the GPU is there but can't encode, the API logs why and transcodes on the CPU. If
# Docker can't provide the GPU (no card, driver or toolkit), it won't start the API at
# all: take this file out of COMPOSE_FILE and redeploy.
services:
  crypttube-api:
    environment:
      HW_ACCEL: nvenc
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
