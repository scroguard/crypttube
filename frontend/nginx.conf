# Serves the SPA and proxies /api to the backend, so browser, cookies and media
# requests are all same-origin. Access logs are off: request URLs identify content.
server_tokens off;
access_log off;

# Resolve the API through Docker's DNS at request time, not once at startup: nginx then
# starts (and keeps serving the app) even if the API isn't up yet, and follows the API
# to its new address when that container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind another reverse proxy, pass on the scheme the visitor actually used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $sent_http_content_type $csp {
    default "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # The visitor's address (the API's login throttle counts failures per address). Only
    # the reverse proxy in TRUSTED_PROXY may say who the visitor is; anything else a
    # client sends in X-Forwarded-For is ignored, and the API gets this one address.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    set $api http://crypttube-api:8000;

    # Liveness of this container itself (for reverse proxies / stack managers).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Media uploads into users' own libraries, and the admin's Stash database upload: no
    # size cap here (limits are enforced by the API while streaming), and never spooled
    # to nginx's disk.
    location ~ ^/api/(my/libraries/[0-9]+/files|stash-import/upload)$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 0;
    }

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Stream video/transcodes straight through instead of spooling to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 25m;
    }

    # Hashed build assets never change. (An add_header here drops the server's, so
    # every security header is repeated.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri /index.html;
    }
}
