# Isolated end-to-end test stack. Run via scripts/e2e.sh, which uses its own project
# name (crypttube-e2e) and names its volumes itself (below), so its database and
# generated-content volumes are never your library's, however it is started; no
# published ports, and generated fixture media instead of your library.
# Fixed container names are global, so the test stack gets its own.
services:
  crypttube-db:
    container_name: crypttube-e2e-db
  crypttube-api:
    container_name: crypttube-e2e-api
    environment:
      SCAN_SETTLE_SECONDS: "1"
    volumes:
      - ./frontend/e2e/media:/media
  crypttube-worker:
    container_name: crypttube-e2e-worker
    environment:
      SCAN_SETTLE_SECONDS: "1"
      WATCHER_QUIET_SECONDS: "1"
    volumes:
      - ./frontend/e2e/media:/media
  crypttube-web:
    container_name: crypttube-e2e-web
    ports: !reset []
  crypttube-e2e:
    container_name: crypttube-e2e-runner
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    depends_on: [crypttube-web]
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      BASE_URL: http://crypttube-web
      CI: "1"
    volumes:
      - ./frontend:/app
    networks: [crypttube]
    command: ["npx", "playwright", "test"]

volumes:
  pgdata:
    name: crypttube-e2e_pgdata
  generated:
    name: crypttube-e2e_generated
  uploads:
    name: crypttube-e2e_uploads
